name: make-reels

on:
  schedule:
    # GitHub sometimes skips or delays scheduled runs, so try three times a night.
    # The first run makes the batch; later runs see it is done and exit.
    - cron: "30 19 * * *"   # 01:00 IST
    - cron: "30 21 * * *"   # 03:00 IST backup
    - cron: "45 22 * * *"   # 04:15 IST backup
  workflow_dispatch:
    inputs:
      count:
        description: "How many reels to make"
        default: "35"
      auto:
        description: "1 = automatic trigger (skip if today's batch is already done)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH_SIZE: ${{ inputs.count || '35' }}
      AUTO: ${{ inputs.auto || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - name: Make sure the queue release exists
        run: gh release view queue >/dev/null 2>&1 || gh release create queue --title "Reel queue" --notes "Rendered reels waiting to be posted."
      - name: Render and queue reels
        run: python main.py batch
      - name: Save queue
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json queue.json
          git diff --cached --quiet || (git commit -m "queued reels" && git pull --rebase -q && git push)
