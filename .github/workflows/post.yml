name: post-reel

on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST
    - cron: "30 12 * * *"   # 18:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Post the reel that is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python main.py post
      - name: Save queue
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json queue.json
          git diff --cached --quiet || (git commit -m "posted reel" && git pull --rebase -q && git push)
