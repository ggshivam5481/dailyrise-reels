name: post-reel

on:
  schedule:
    # GitHub often starts scheduled runs late, so try 4 times around each slot.
    # The first run posts the due reel; later runs find nothing due and exit.
    - cron: "20,35,50 0 * * *"   # 05:50 / 06:05 / 06:20 IST
    - cron: "5 1 * * *"          # 06:35 IST
    - cron: "20,35,50 12 * * *"  # 17:50 / 18:05 / 18:20 IST
    - cron: "5 13 * * *"         # 18:35 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - name: Post the reel that is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python main.py post
      - name: Save queue
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json queue.json
          git diff --cached --quiet || (git commit -m "posted reel" && git pull --rebase -q && git push)
