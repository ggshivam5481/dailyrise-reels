name: post-reel

on:
  schedule:
    # Start ~45 min early and wait inside the job until the exact slot (GitHub cron is often late).
    # Backup runs post immediately if the first one was dropped; they exit if the reel is already posted.
    - cron: "15 0 * * *"    # 05:45 IST -> waits, posts at 06:00
    - cron: "40 0 * * *"    # 06:10 IST backup
    - cron: "10 1 * * *"    # 06:40 IST backup
    - cron: "15 12 * * *"   # 17:45 IST -> waits, posts at 18:00
    - cron: "40 12 * * *"   # 18:10 IST backup
    - cron: "10 13 * * *"   # 18:40 IST backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - name: Post the reel that is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python main.py post
      - name: Save queue
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json queue.json
          git diff --cached --quiet || (git commit -m "posted reel" && git pull --rebase -q && git push)
