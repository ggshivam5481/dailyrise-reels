name: daily-reel

on:
  schedule:
    - cron: "30 12 * * *"   # 18:00 IST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-comic-neue fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - name: Render and post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python main.py
      - name: Keep the rendered reel for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Save progress
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "posted reel" && git push)
